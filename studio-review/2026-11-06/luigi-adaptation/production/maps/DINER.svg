f"><tspan x="755" dy="0">东柜台</tspan></text><text x="45" y="590" fill="#263039" font-size="18" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">宾州快餐店；入口南，东侧柜台/玛拉工作区，西侧临街窗，北侧后排座位与厕所通道；路易吉坐西北后排，背包靠右脚，警</tspan><tspan x="45" dy="29.7">员从南入口沿中央通道来。清早西窗冷光、柜台暖白灯。所有过肩反打沿南北轴同侧，不交换门与柜台。</tspan></text></svg>