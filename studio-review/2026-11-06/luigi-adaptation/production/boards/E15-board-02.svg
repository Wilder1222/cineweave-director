<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E15 撤销 · 2</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E15-SH010"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E15-SH010)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP15-007  36s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">编辑部西桌南侧50mm诺拉与女编辑共享中景，</tspan><tspan x="35" dy="24.75">真实记录与旧回执在桌上两排。</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">真实反证与未解疑点同时存在，后者不能洗掉前者。</tspan></text><defs><clipPath id="clip-E15-SH011"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E15-SH011)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><rect x="535" y="190" width="140" height="105" rx="8" fill="#e8e4dc" stroke="#556774" stroke-width="3"/><path d="M455 315L545 250Q563 235 578 255L553 290M755 315L665 250" fill="none" stroke="#556774" stroke-width="22" stroke-linecap="round"/></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP15-008  12s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">诺拉西肩后65mm红本、手机与电脑下半屏近景</tspan><tspan x="425" dy="24.75">，编辑手从东侧进入提示截止时间。</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">采访警告就在手里，她仍选择先求来源帮忙。</tspan></text></svg>