<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E22 是我 · 1</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E22-SH001"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH001)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g><text x="317" y="315" fill="#a44333" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="317" dy="0">运动镜</tspan></text></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP22-001  44s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">走廊西椅双人中景起，西南机位连续摇随到东饮水</tspan><tspan x="35" dy="24.75">机及北门。</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">他接受最后一次可私谈机会的存在，却选择亲自进去作答。</tspan></text><defs><clipPath id="clip-E22-SH004"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH004)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(515.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(605.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(695.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP22-002  36s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">联邦庭南侧固定中全景</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">本人宣誓并承认没有刑期或纽约撤案保证。</tspan></text><defs><clipPath id="clip-E22-SH006"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH006)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP22-003  36s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">南偏西固定青年与海伦的双人中景</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">完整认罪由本人说出，故意杀人的句子不能被配乐或反应镜</tspan><tspan x="815" dy="21.45">盖掉。</tspan></text><defs><clipPath id="clip-E22-SH008"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH008)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(215.0,635) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP22-004  20s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">东南旁听席瑞秋固定中近景；法官北席、青年西桌</tspan><tspan x="35" dy="24.75">均只为真实同场画外声</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">受害家属听见具体死亡因果，镜头不向杀人者索取表情回应</tspan><tspan x="35" dy="21.45">。</tspan></text><defs><clipPath id="clip-E22-SH009"><rect x="425" y="475" width="360" height="202"/></clipPath></defs><rect x="425" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH009)"><path d="M425 630H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP22-005  19s</tspan></text><text x="425" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">法庭南端固定宽中景</tspan></text><text x="425" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">供述完成且被接受，公众的离开不能替青年撤回答案。</tspan></text><defs><clipPath id="clip-E22-SH010"><rect x="815" y="475" width="360" height="202"/></clipPath></defs><rect x="815" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E22-SH010)"><path d="M815 630H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP22-006  49s</tspan></text><text x="815" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">法院外西侧采访栏南端固定共享中景</tspan></text><text x="815" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">公众得到程序已走到哪里，不得到虚构的释放令。</tspan></text></svg>