<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E01 橙色 · 1</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E01-SH001"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E01-SH001)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#d57238"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#d57238"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#d57238" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP01-001  9s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">中全景，西南向东北，轴西侧；从鞋至头顶完整容</tspan><tspan x="35" dy="24.75">纳青年和两侧警员。</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">南行突然受阻，镜头却把疼痛动作当作可争抢的表情。</tspan></text><defs><clipPath id="clip-E01-SH002"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E01-SH002)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#d57238"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#d57238"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#d57238" stroke-width="8" fill="none" stroke-linecap="round"/></g><text x="707" y="315" fill="#a44333" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="707" dy="0">运动镜</tspan></text></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP01-002  8s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">中景，西侧向东南，容纳青年头至腰链及警员接触</tspan><tspan x="425" dy="24.75">上臂。</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">他在争取身体空间，警员配合后才继续走。</tspan></text><defs><clipPath id="clip-E01-SH003"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E01-SH003)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#d57238"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#d57238"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#d57238" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP01-003  9s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">中全景，南车门西侧朝北偏东，容纳青年头至脚、</tspan><tspan x="815" dy="24.75">踏板和门框。</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">一次寻找踏板的抬眼已被数十部手机截取。</tspan></text><defs><clipPath id="clip-E02-SH001"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E02-SH001)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(215.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP01-004  13s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">全景，南门内朝北，轴西侧</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">疼痛妨碍起身，他仍能处理别人的具体求助。</tspan></text><defs><clipPath id="clip-E02-SH002"><rect x="425" y="475" width="360" height="202"/></clipPath></defs><rect x="425" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E02-SH002)"><path d="M425 630H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP01-005  15s</tspan></text><text x="425" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">中景，桌西侧朝东北</tspan></text><text x="425" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">他懂得保留证据、遮住隐私，却仍不回应家人。</tspan></text><defs><clipPath id="clip-E02-SH003"><rect x="815" y="475" width="360" height="202"/></clipPath></defs><rect x="815" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E02-SH003)"><path d="M815 630H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(995.0,635) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP01-006  22s</tspan></text><text x="815" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">近景，北桌西南看手与脸</tspan></text><text x="815" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">回复被他主动删掉；家人只能继续等。</tspan></text></svg>