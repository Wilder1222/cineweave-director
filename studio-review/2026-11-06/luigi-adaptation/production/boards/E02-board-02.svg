<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E02 第五天 · 2</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E03-SH007"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E03-SH007)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g><text x="317" y="315" fill="#a44333" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="317" dy="0">运动镜</tspan></text></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP02-007  40s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">南入口内平视三人中全景</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">建立孩子自己的任务与妹妹的照顾工作，母亲的账务焦虑挤</tspan><tspan x="35" dy="21.45">占了一次实际请求。</tspan></text><defs><clipPath id="clip-E03-SH008"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E03-SH008)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(545.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(665.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP02-008  40s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">桌东侧低位双人中景，乔的穿袜动作在边缘</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">道歉换来有条件的继续合作，而非一句台词就修复关系。</tspan></text><defs><clipPath id="clip-E03-SH009"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E03-SH009)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP02-009  40s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">南门方向的姐妹中景</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">加班不是抽象牺牲，它把母亲欠下的时间转嫁给同样要工作</tspan><tspan x="815" dy="21.45">的妹妹。</tspan></text><defs><clipPath id="clip-E03-SH010"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E03-SH010)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP02-010  40s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">南门内朝北的中全景</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">诊所确认拒赔，孩子得到诚实的不确定答复；母亲离家后生</tspan><tspan x="35" dy="21.45">活继续，压力未获安慰性解决。</tspan></text></svg>