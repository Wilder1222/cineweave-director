<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E17 活下来 · 1</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E16-SH001"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH001)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(125.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(215.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(305.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP17-001  38s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">南侧略偏西固定中全景</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">法官要求辩方把法律分类和实际枪杀分开，海伦回答后等待</tspan><tspan x="35" dy="21.45">正式裁定。</tspan></text><defs><clipPath id="clip-E16-SH004"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH004)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP17-002  17s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">南侧朝北固定法官中景</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">正式排除死刑，余下控罪继续。</tspan></text><defs><clipPath id="clip-E16-SH005"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH005)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP17-003  25s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">西南固定辩方双人中景</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">短暂松口气并不消除第二天的新选择。</tspan></text><defs><clipPath id="clip-E16-SH007"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH007)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP17-004  50s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">桌西侧固定双人中景</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">他确认拒绝是真选项，随后必须面对自己更早决定的日期。</tspan></text><defs><clipPath id="clip-E16-SH009"><rect x="425" y="475" width="360" height="202"/></clipPath></defs><rect x="425" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH009)"><path d="M425 630H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP17-005  32s</tspan></text><text x="425" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">青年近中景，桌西南朝北，海伦在南侧画外。</tspan></text><text x="425" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">完整交付既不保证莉娜全身而退，也会留下对青年不利的部</tspan><tspan x="425" dy="21.45">分。</tspan></text><defs><clipPath id="clip-E16-SH011"><rect x="815" y="475" width="360" height="202"/></clipPath></defs><rect x="815" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E16-SH011)"><path d="M815 630H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,575) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP17-006  28s</tspan></text><text x="815" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">桌西固定共享中景</tspan></text><text x="815" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">他交出完整记录，不索取必定换来清白的保证。</tspan></text></svg>