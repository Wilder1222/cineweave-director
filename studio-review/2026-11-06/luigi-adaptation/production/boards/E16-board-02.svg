<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E16 改掉那一行 · 2</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E18-SH004"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E18-SH004)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><rect x="145" y="190" width="140" height="105" rx="8" fill="#e8e4dc" stroke="#556774" stroke-width="3"/><path d="M65 315L155 250Q173 235 188 255L163 290M365 315L275 250" fill="none" stroke="#556774" stroke-width="22" stroke-linecap="round"/></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP16-007  14s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">诺拉西肩后65mm桌面近景，获准拍摄的旧报告</tspan><tspan x="35" dy="24.75">封面照片、红本和未付账单同框，手机在右。</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">更正已公开、来源未回应，附件问题从她已有照片开始。</tspan></text><defs><clipPath id="clip-E18-SH009"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E18-SH009)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,295) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><ellipse cx="443" cy="325" rx="65" ry="100" fill="#262b31" opacity=".65"/></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP16-008  28s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">诺拉西肩旁朝北65mm莉娜中近景，灰信封压在</tspan><tspan x="425" dy="24.75">左手下，诺拉只露肩；南门在机位后方画外。</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">道歉没有直接换来信任，求职和重回工作的现实压力落在来</tspan><tspan x="425" dy="21.45">源身上。</tspan></text><defs><clipPath id="clip-E18-SH011"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E18-SH011)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP16-009  37s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">桌西侧40mm双人中景，莉娜北、诺拉南，问题</tspan><tspan x="815" dy="24.75">便签在中间，双方手机仍各归自己。</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">许可先谈妥再取报告，记者没有用道歉跳过边界。</tspan></text><defs><clipPath id="clip-E18-SH012"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E18-SH012)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><rect x="145" y="530" width="140" height="105" rx="8" fill="#e8e4dc" stroke="#556774" stroke-width="3"/><path d="M65 655L155 590Q173 575 188 595L163 630M365 655L275 590" fill="none" stroke="#556774" stroke-width="22" stroke-linecap="round"/></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP16-010  24s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">诺拉西肩后60mm斜俯桌面近景，旧手机照片在</tspan><tspan x="35" dy="24.75">南、莉娜遮名原件在北，手指仍压着原件。</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">ATTACHMENTS: SEE LIST早在旧照片</tspan><tspan x="35" dy="21.45">中，现在只是待取得清单的入口，尚无队列或缺陷结论…</tspan></text></svg>