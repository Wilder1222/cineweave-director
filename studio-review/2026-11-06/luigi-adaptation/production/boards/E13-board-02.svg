<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="850" viewBox="0 0 1210 850"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G4 · E13 收钱的人 · 2</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">景别索引示意，人物符号不是精确走位或关键帧；具体构图、注意力和剪点以镜头卡为准。</tspan></text><defs><clipPath id="clip-E13-SH010"><rect x="35" y="135" width="360" height="202"/></clipPath></defs><rect x="35" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E13-SH010)"><path d="M35 290H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(155.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(275.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="43" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP13-007  30s</tspan></text><text x="35" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">编辑部西桌南侧40mm共享中景，编辑站东，诺</tspan><tspan x="35" dy="24.75">拉坐西，屏幕边缘与手机同时可见。</tspan></text><text x="35" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">撤本站视频、截图和缩略图做完；外部副本仍在，不能用一</tspan><tspan x="35" dy="21.45">次点击消失。</tspan></text><defs><clipPath id="clip-E13-SH011"><rect x="425" y="135" width="360" height="202"/></clipPath></defs><rect x="425" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E13-SH011)"><path d="M425 290H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,295) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="433" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP13-008  10s</tspan></text><text x="425" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">西桌东南侧75mm诺拉中近景，手机贴耳、翻扣</tspan><tspan x="425" dy="24.75">提纲在画幅下缘，编辑不入画。</tspan></text><text x="425" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">一句实际处理结果和道歉，没有向对方要新材料或谅解。</tspan></text><defs><clipPath id="clip-E13-SH012"><rect x="815" y="135" width="360" height="202"/></clipPath></defs><rect x="815" y="135" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E13-SH012)"><path d="M815 290H1175" stroke="#b5bab8" stroke-width="2"/><g transform="translate(935.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><g transform="translate(1055.0,235) scale(0.65)"><circle cy="-25" r="12" fill="#262b31"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#262b31"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#262b31" stroke-width="8" fill="none" stroke-linecap="round"/></g></g><text x="823" y="158" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="823" dy="0">EP13-009  26s</tspan></text><text x="815" y="367" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">会见桌西侧40mm双人中景，青年北、海伦南，</tspan><tspan x="815" dy="24.75">整页声明与遮名截图在中间。</tspan></text><text x="815" y="420" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="815" dy="0">律师要求他说出删前言的原因，患者不再承担他的论证。</tspan></text><defs><clipPath id="clip-E13-SH013"><rect x="35" y="475" width="360" height="202"/></clipPath></defs><rect x="35" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E13-SH013)"><path d="M35 630H395" stroke="#b5bab8" stroke-width="2"/><g transform="translate(215.0,635) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><ellipse cx="53" cy="665" rx="65" ry="100" fill="#262b31" opacity=".65"/></g><text x="43" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="43" dy="0">EP13-010  30s</tspan></text><text x="35" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">青年西肩旁朝南65mm海伦中近景，签署的页和</tspan><tspan x="35" dy="24.75">青年笔手在下前景。</tspan></text><text x="35" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="35" dy="0">筹款者反对的可能被说清，青年坚持，律师承诺不添加自己</tspan><tspan x="35" dy="21.45">的开场。</tspan></text><defs><clipPath id="clip-E13-SH014"><rect x="425" y="475" width="360" height="202"/></clipPath></defs><rect x="425" y="475" width="360" height="202" fill="#d5dcdd" stroke="#556774"/><g clip-path="url(#clip-E13-SH014)"><path d="M425 630H785" stroke="#b5bab8" stroke-width="2"/><g transform="translate(605.0,635) scale(1.65)"><circle cy="-25" r="12" fill="#556774"/><path d="M-20 0Q0-15 20 0L15 42H-15Z" fill="#556774"/><path d="M-8 42L-12 75M8 42L12 75M-20 0L-28 30M20 0L28 30" stroke="#556774" stroke-width="8" fill="none" stroke-linecap="round"/></g><ellipse cx="443" cy="665" rx="65" ry="100" fill="#262b31" opacity=".65"/></g><text x="433" y="498" fill="#263039" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="433" dy="0">EP13-011  9s</tspan></text><text x="425" y="707" fill="#263039" font-size="15" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">海伦西肩后65mm电脑与签署页近景，正文不含</tspan><tspan x="425" dy="24.75">患者细节，海伦只留肩和手。</tspan></text><text x="425" y="760" fill="#263039" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="425" dy="0">发布完成后反对留言出现，她保存已发布版本。</tspan></text></svg>