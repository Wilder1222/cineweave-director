<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G1 · 材质卡 / SURFACE RESPONSE</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">图案和几何高光仅表达设计区别；真实纹理须由演员、服装和场景样片核验</tspan></text><defs><linearGradient id="face"><stop stop-color="#cba58e"/><stop offset=".52" stop-color="#af8b75"/><stop offset="1" stop-color="#745d50"/></linearGradient><linearGradient id="deepface"><stop stop-color="#906b54"/><stop offset="1" stop-color="#483a34"/></linearGradient><linearGradient id="steel"><stop stop-color="#596870"/><stop offset=".45" stop-color="#b8c2c2"/><stop offset=".6" stop-color="#d4d8d2"/><stop offset="1" stop-color="#78868a"/></linearGradient><pattern id="cotton" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1H6M1 0V6" stroke="#794d34" opacity=".25" stroke-width=".6"/></pattern><pattern id="paper" width="29" height="19" patternUnits="userSpaceOnUse"><path d="M4 4l8 1M18 13l5 -1" stroke="#aca798" opacity=".3"/></pattern></defs><rect x="45" y="140" width="350" height="150" fill="#6b2933"/><rect x="45" y="140" width="350" height="150" fill="url(#knit)"/><text x="45" y="324" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">深红针织</tspan></text><text x="45" y="355" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">保留线圈，不靠锐化描边</tspan></text><rect x="435" y="140" width="350" height="150" fill="#d57238"/><rect x="435" y="140" width="350" height="150" fill="url(#cotton)"/><text x="435" y="324" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="435" dy="0">橙色棉布</tspan></text><text x="435" y="355" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="435" dy="0">亮部保折痕，不变塑料</tspan></text><rect x="825" y="140" width="350" height="150" fill="#e8e4dc"/><rect x="825" y="140" width="350" height="150" fill="url(#paper)"/><text x="825" y="324" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="825" dy="0">无涂层白纸</tspan></text><text x="825" y="355" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="825" dy="0">细纹与折边，不发光</tspan></text><rect x="45" y="400" width="350" height="150" fill="url(#steel)"/><text x="45" y="584" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">拉丝金属</tspan></text><text x="45" y="615" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">高光局部，不白成整板</tspan></text><rect x="435" y="400" width="350" height="150" fill="#8e6d53"/><path d="M443 415q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 433q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 451q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 469q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 487q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 505q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><path d="M443 523q170 12 330 -3" stroke="#604c3d" fill="none" opacity=".4"/><text x="435" y="584" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="435" dy="0">磨损旧木</tspan></text><text x="435" y="615" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="435" dy="0">色差来自使用，不统一磨皮</tspan></text><rect x="825" y="400" width="350" height="150" fill="#b8c5c7"/><rect x="935" y="420" width="125" height="110" fill="#60737a" opacity=".18"/><text x="825" y="584" fill="#263039" font-size="21" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="825" dy="0">磨砂玻璃</tspan></text><text x="825" y="615" fill="#263039" font-size="16" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="825" dy="0">透光与漫反射分开</tspan></text></svg>