<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="cold"><stop stop-color="#7791a3"/><stop offset="1" stop-color="#d6d7d0"/></linearGradient><linearGradient id="warm"><stop stop-color="#b0805a"/><stop offset="1" stop-color="#e8d9c4"/></linearGradient><pattern id="knit" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L4 5L0 10M8 0L4 5L8 10" fill="none" stroke="#a67278" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="#f4f1e9"/><text x="42" y="55" fill="#263039" font-size="29" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">G1 · 配色卡 / COLOR RELATIONSHIPS</tspan></text><text x="42" y="91" fill="#68727a" font-size="14" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="42" dy="0">设计色值，不是从参考剧提取；不构成LUT、曝光或输出色彩空间参数</tspan></text><defs><linearGradient id="face"><stop stop-color="#cba58e"/><stop offset=".52" stop-color="#af8b75"/><stop offset="1" stop-color="#745d50"/></linearGradient><linearGradient id="deepface"><stop stop-color="#906b54"/><stop offset="1" stop-color="#483a34"/></linearGradient><linearGradient id="steel"><stop stop-color="#596870"/><stop offset=".45" stop-color="#b8c2c2"/><stop offset=".6" stop-color="#d4d8d2"/><stop offset="1" stop-color="#78868a"/></linearGradient><pattern id="cotton" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1H6M1 0V6" stroke="#794d34" opacity=".25" stroke-width=".6"/></pattern><pattern id="paper" width="29" height="19" patternUnits="userSpaceOnUse"><path d="M4 4l8 1M18 13l5 -1" stroke="#aca798" opacity=".3"/></pattern></defs><rect x="45" y="140" width="255" height="108" fill="#556774"/><text x="45" y="279" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">环境 · 冬日灰蓝</tspan></text><text x="45" y="304" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">#556774</tspan></text><rect x="335" y="140" width="255" height="108" fill="#c8c9c4"/><text x="335" y="279" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="335" dy="0">墙石 · 中性灰</tspan></text><text x="335" y="304" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="335" dy="0">#c8c9c4</tspan></text><rect x="625" y="140" width="255" height="108" fill="#a5795b"/><text x="625" y="279" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="625" dy="0">局部 · 灯下旧木</tspan></text><text x="625" y="304" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="625" dy="0">#a5795b</tspan></text><rect x="915" y="140" width="255" height="108" fill="#262b31"/><text x="915" y="279" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="915" dy="0">暗部 · 深炭灰</tspan></text><text x="915" y="304" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="915" dy="0">#262b31</tspan></text><rect x="45" y="320" width="255" height="108" fill="#e8e4dc"/><text x="45" y="459" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">高光 · 纸白</tspan></text><text x="45" y="484" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="45" dy="0">#e8e4dc</tspan></text><rect x="335" y="320" width="255" height="108" fill="#6b2933"/><text x="335" y="459" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="335" dy="0">身份 · 深红针织</tspan></text><text x="335" y="484" fill="#5e666c" font-size="13" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="335" dy="0">#6b2933</tspan></text><rect x="625" y="320" width="255" height="108" fill="#d57238"/><text x="625" y="459" fill="#263039" font-size="17" font-family="Microsoft YaHei,Segoe UI,sans-serif"><tspan x="625" dy="0">身份 · 哑光橙棉</tspan></text><text x="625" y="484" 