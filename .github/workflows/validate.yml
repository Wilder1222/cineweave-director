name: 项目校验

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置 Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 运行校验回归测试
        run: node --test tests/canonical-json.test.mjs tests/validate-output.test.mjs tests/build-plugin-bundle.test.mjs tests/check-delivery.test.mjs
      - name: 检查契约索引
        run: node scripts/generate-contract-index.mjs --check
      - name: 校验源分发
        run: node scripts/validate-repository.mjs
      - name: 核对发布标签与版本
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag ' + process.env.GITHUB_REF_NAME + ' must equal ' + expected);"
      - name: 构建字节一致的插件包
        run: node scripts/build-plugin-bundle.mjs
      - name: 校验构建包
        run: node scripts/validate-repository.mjs --bundle .build/cineweave-director
