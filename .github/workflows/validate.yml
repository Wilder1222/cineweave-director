name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test validation primitives
        run: npm test
      - name: Validate source distribution
        run: npm run validate
      - name: Verify release tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag ' + process.env.GITHUB_REF_NAME + ' must equal ' + expected);"
      - name: Build byte-identical plugin bundle
        run: npm run build
      - name: Validate built bundle
        run: npm run validate:bundle
