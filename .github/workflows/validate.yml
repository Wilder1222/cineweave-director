name: 项目校验

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置 Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: 校验源分发
        run: node scripts/validate-repository.mjs
      - name: 运行校验回归测试
        run: npm test
      - name: 检查契约索引
        run: node scripts/generate-contract-index.mjs --check
      - name: 核对发布标签与版本
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = JSON.parse(readFileSync('package.json', 'utf8')).version; const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag ' + process.env.GITHUB_REF_NAME + ' must equal ' + expected);"
      - name: 构建字节一致的插件包
        run: node scripts/build-plugin-bundle.mjs
      - name: 校验构建包
        run: node scripts/validate-repository.mjs --bundle .build/cineweave-director
      - name: 验证安装后的只读工具
        run: node --test tests/bundle-smoke.test.mjs
