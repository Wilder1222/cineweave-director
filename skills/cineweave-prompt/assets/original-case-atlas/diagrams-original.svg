<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" data-case-id="case.atlas.diagrams-original">
  <title>Three-node evidence flow</title>
  <desc>Original deterministic diagrams fixture; no external media or provider output.</desc>
  <rect width="1200" height="900" fill="#F6F7FA"/>
  <g data-element="edges" fill="none" stroke="#273247" stroke-width="8"><path d="M330 430 H520"/><path d="M680 430 H870"/><path d="M500 415 L525 430 L500 445" fill="#273247"/><path d="M850 415 L875 430 L850 445" fill="#273247"/></g>
  <g data-element="nodes" stroke="#273247" stroke-width="6"><rect x="120" y="340" width="210" height="180" rx="28" fill="#DDE8FF"/><rect x="495" y="340" width="210" height="180" rx="28" fill="#FFDE8A"/><rect x="870" y="340" width="210" height="180" rx="28" fill="#BFE7D1"/></g>
  <text x="225" y="450" fill="#273247" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">INTENT</text>
  <text x="600" y="450" fill="#273247" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">CONSTRAINT</text>
  <text x="975" y="450" fill="#273247" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">EVIDENCE</text>
  <g data-element="legend"><text x="600" y="690" fill="#273247" font-family="system-ui, sans-serif" font-size="20" font-weight="500" text-anchor="middle">LEFT TO RIGHT · THREE VERIFIED NODES</text></g>
</svg>
