<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}</style><rect x="0" y="0" width="1400" height="900" fill="#151d23"/><text x="45" y="62" font-size="34" fill="#e8e4d9">G1 / 配色卡：西暖与东冷不交换世界方向</text><text x="45" y="98" font-size="18" fill="#a4b6bf">G1 PALETTE · HP01 / SC01 · r1 · 原创矢量设计，非真实样片</text><text x="45" y="872" font-size="18" fill="#a4b6bf">仅设计交付 / 媒体未提供 / 24秒 · 4镜 · 16:9 / 完整提示词与判据见 output.md</text><rect x="55" y="170" width="240" height="260" fill="#302820"/><text x="55" y="484" font-size="26" fill="#e8e4d9">#302820</text><text x="55" y="528" font-size="23" fill="#e8e4d9">45% 焦木褐</text><text x="55" y="570" font-size="20" fill="#a4b6bf">窗 / 桌 / 暗背景</text><rect x="322" y="170" width="240" height="260" fill="#434F56"/><text x="322" y="484" font-size="26" fill="#e8e4d9">#434F56</text><text x="322" y="528" font-size="23" fill="#e8e4d9">25% 炭蓝灰</text><text x="322" y="570" font-size="20" fill="#a4b6bf">棉麻袍 / 榻影</text><rect x="589" y="170" width="240" height="260" fill="#B9AA91"/><text x="589" y="484" font-size="26" fill="#e8e4d9">#B9AA91</text><text x="589" y="528" font-size="23" fill="#e8e4d9">20% 灰米</text><text x="589" y="570" font-size="20" fill="#a4b6bf">薄皮 / 衣领</text><rect x="856" y="170" width="240" height="260" fill="#D3984D"/><text x="856" y="484" font-size="26" fill="#e8e4d9">#D3984D</text><text x="856" y="528" font-size="23" fill="#e8e4d9">≤5% 琥珀</text><text x="856" y="570" font-size="20" fill="#a4b6bf">西灯局部高光</text><rect x="1123" y="170" width="240" height="260" fill="#718894"/><text x="1123" y="484" font-size="26" fill="#e8e4d9">#718894</text><text x="1123" y="528" font-size="23" fill="#e8e4d9">约5% 冷灰青</text><text x="1123" y="570" font-size="20" fill="#a4b6bf">东方极弱边缘</text><text x="65" y="672" font-size="22" fill="#e8e4d9">sRGB显示设计值与面积意向，不是实测材质、LUT或精确模型保证。四镜共用同一色彩命题；肤色不整体</text><text x="65" y="706" font-size="22" fill="#e8e4d9">染青或染黄。</text></svg>
