<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}</style><rect x="0" y="0" width="1400" height="900" fill="#151d23"/><text x="45" y="62" font-size="34" fill="#e8e4d9">G1 / 风格卡：日常手艺中的身份伪装</text><text x="45" y="98" font-size="18" fill="#a4b6bf">G1 STYLE · HP01 / SC01 · r1 · 原创矢量设计，非真实样片</text><text x="45" y="872" font-size="18" fill="#a4b6bf">仅设计交付 / 媒体未提供 / 24秒 · 4镜 · 16:9 / 完整提示词与判据见 output.md</text><rect x="70" y="155" width="380" height="360" fill="#202c34"/><rect x="95" y="185" width="330" height="190" fill="#302820"/><text x="95" y="429" font-size="24" fill="#e8e4d9">窗框 / 观看边界</text><rect x="115" y="185" width="12" height="190" fill="#8c7354"/><rect x="215" y="185" width="12" height="190" fill="#8c7354"/><rect x="315" y="185" width="12" height="190" fill="#8c7354"/><line x1="95" y1="278" x2="425" y2="278" stroke="#8c7354" stroke-width="10"/><rect x="500" y="155" width="380" height="360" fill="#202c34"/><rect x="525" y="185" width="330" height="190" fill="#B9AA91"/><text x="525" y="429" font-size="24" fill="#e8e4d9">薄皮 / 连续物理</text><line x1="550" y1="220" x2="815" y2="245" stroke="#827560" stroke-width="3"/><line x1="550" y1="265" x2="815" y2="290" stroke="#827560" stroke-width="3"/><line x1="550" y1="310" x2="815" y2="335" stroke="#827560" stroke-width="3"/><circle cx="690" cy="230" r="22" fill="#827560"/><rect x="930" y="155" width="380" height="360" fill="#202c34"/><rect x="955" y="185" width="330" height="190" fill="#434F56"/><text x="955" y="429" font-size="24" fill="#e8e4d9">女子 / 稳定终态</text><circle cx="1120" cy="225" r="22" fill="#B9AA91"/><rect x="1090" y="252" width="60" height="95" fill="#B9AA91"/><line x1="1096" y1="347" x2="1088" y2="385" stroke="#B9AA91" stroke-width="10"/><line x1="1144" y1="347" x2="1152" y2="385" stroke="#B9AA91" stroke-width="10"/><text x="75" y="572" font-size="22" fill="#e8e4d9">写实摄影：木边清楚、棉麻有重量，薄皮必须区别纸与衣服。固定镜头让动作成为证据。</text><text x="75" y="682" font-size="22" fill="#e8e4d9">时间：4镜连续观察；描→提→抖→披→成形。无闪白、烟遮、魔法发光、血伤、裸露、冲窗惊吓。</text></svg>
