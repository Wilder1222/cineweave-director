<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}</style><rect x="0" y="0" width="1400" height="900" fill="#151d23"/><text x="45" y="62" font-size="34" fill="#e8e4d9">G2 / 场景结构图：同一坐标系内的空间硬锁</text><text x="45" y="98" font-size="18" fill="#a4b6bf">G2 GEOGRAPHY · HP01 / SC01 · r1 · 原创矢量设计，非真实样片</text><text x="45" y="872" font-size="18" fill="#a4b6bf">仅设计交付 / 媒体未提供 / 24秒 · 4镜 · 16:9 / 完整提示词与判据见 output.md</text><rect x="130" y="160" width="720" height="560" fill="#202c34" stroke="#82939b" stroke-width="2"/><text x="465" y="142" font-size="22" fill="#e8e4d9">北 N</text><text x="78" y="435" font-size="20" fill="#e8e4d9">西 W</text><text x="870" y="435" font-size="20" fill="#e8e4d9">东 E</text><text x="465" y="765" font-size="22" fill="#e8e4d9">南 S</text><rect x="330" y="190" width="390" height="120" fill="#302820" stroke="#907c64" stroke-width="2"/><text x="355" y="227" font-size="22" fill="#e8e4d9">北榻 B1 / 皮与竹碟</text><rect x="175" y="315" width="100" height="110" fill="#302820" stroke="#907c64" stroke-width="2"/><circle cx="225" cy="345" r="13" fill="#d3984d"/><text x="160" y="463" font-size="23" fill="#d3984d">西桌 L1</text><rect x="835" y="340" width="15" height="120" fill="#718894"/><line x1="830" y1="380" x2="650" y2="330" stroke="#718894" stroke-width="4"/><line x1="650" y1="330" x2="664.4197501235853" y2="325.868316762703" stroke="#718894" stroke-width="4"/><line x1="650" y1="330" x2="660.2229292385059" y2="340.976871948989" stroke="#718894" stroke-width="4"/><rect x="170" y="160" width="115" height="14" fill="#806d56"/><text x="170" y="193" font-size="18" fill="#e8e4d9">关闭门</text><rect x="440" y="709" width="130" height="15" fill="#a58b65"/><text x="580" y="719" font-size="20" fill="#e8e4d9">固定南窗 W1</text><circle cx="535" cy="285" r="20" fill="#a0a6a5"/><text x="560" y="310" font-size="20" fill="#e8e4d9">主体朝南</text><circle cx="480" cy="292" r="8" fill="#b9aa91"/><text x="325" y="339" font-size="19" fill="#e8e4d9">碟：主体右 / 世界西</text><circle cx="520" cy="775" r="17" fill="#718894"/><text x="545" y="791" font-size="21" fill="#e8e4d9">王生窗外</text><line x1="520" y1="750" x2="535" y2="325" stroke="#b9aa91" stroke-width="4"/><line x1="535" y1="325" x2="542.3843740895479" y2="338.05645508189775" stroke="#b9aa91" stroke-width="4"/><line x1="535" y1="325" x2="526.7135145808757" y2="337.5033659227681" stroke="#b9aa91" stroke-width="4"/><rect x="475" y="805" width="20" height="15" fill="#718894"/><text x="110" y="815" font-size="20" fill="#e8e4d9">C2/C3/C4 透过既有开口向北</text><rect x="635" y="790" width="20" height="15" fill="#718894"/><text x="655" y="804" font-size="19" fill="#e8e4d9">C1</text><line x1="225" y1="345" x2="500" y2="285" stroke="#d3984d" stroke-width="4"/><line x1="500" y1="285" x2="489.1773471920544" y2="295.3860572980639" stroke="#d3984d" stroke-width="4"/><line x1="500" y1="285" x2="485.83475595672587" y2="280.06584746947493" stroke="#d3984d" stroke-width="4"/><text x="965" y="192" font-size="22" fill="#e8e4d9">统一世界坐标：北+y，东+x；南</text><text x="965" y="226" font-size="22" fill="#e8e4d9">窗y=0。室内4.8×5米，为设</text><text x="965" y="260" font-size="22" fill="#e8e4d9">计假设。</text><text x="965" y="377" font-size="22" fill="#e8e4d9">不镜像：西桌暖灯、北榻、南木窗、</text><text x="965" y="411" font-size="22" fill="#e8e4d9">东冷环境。王生始终在窗外。</text><text x="965" y="557" font-size="22" fill="#e8e4d9">仅图示：箭头表示光向或目光，不是</text><text x="965" y="591" font-size="22" fill="#e8e4d9">实测光束。机位需后续预演验证窗格</text><text x="965" y="625" font-size="22" fill="#e8e4d9">遮挡。</text></svg>
