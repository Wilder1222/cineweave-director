<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}</style><rect x="0" y="0" width="1400" height="900" fill="#151d23"/><text x="45" y="62" font-size="34" fill="#e8e4d9">G1 / 灯光卡：L1西桌油灯 + L2东方弱环境</text><text x="45" y="98" font-size="18" fill="#a4b6bf">G1 LIGHTING · HP01 / SC01 · r1 · 原创矢量设计，非真实样片</text><text x="45" y="872" font-size="18" fill="#a4b6bf">仅设计交付 / 媒体未提供 / 24秒 · 4镜 · 16:9 / 完整提示词与判据见 output.md</text><rect x="70" y="155" width="700" height="580" fill="#202c34"/><circle cx="420" cy="325" r="22" fill="#434F56"/><rect x="390" y="352" width="60" height="95" fill="#434F56"/><line x1="396" y1="447" x2="388" y2="485" stroke="#434F56" stroke-width="10"/><line x1="444" y1="447" x2="452" y2="485" stroke="#434F56" stroke-width="10"/><circle cx="240" cy="390" r="18" fill="#d3984d"/><line x1="240" y1="390" x2="390" y2="360" stroke="#d3984d" stroke-width="4"/><line x1="390" y1="360" x2="378.9980749100967" y2="370.1959621574502" stroke="#d3984d" stroke-width="4"/><line x1="390" y1="360" x2="375.92285293337767" y2="354.81985227385496" stroke="#d3984d" stroke-width="4"/><line x1="680" y1="300" x2="455" y2="340" stroke="#718894" stroke-width="4"/><line x1="455" y1="340" x2="466.2181398904086" y2="330.04242311607777" stroke="#718894" stroke-width="4"/><line x1="455" y1="340" x2="468.962770551228" y2="345.48097058318683" stroke="#718894" stroke-width="4"/><text x="110" y="683" font-size="23" fill="#d3984d">L1 小暖光：世界西面亮，影偏东</text><text x="825" y="208" font-size="28" fill="#d3984d">L1 / 叙事主光</text><text x="825" y="257" font-size="22" fill="#e8e4d9">西桌真实油灯，小面积暖光；优先读清手指、皮</text><text x="825" y="291" font-size="22" fill="#e8e4d9">边与脸。西墙反光只来自同一盏灯。</text><text x="825" y="463" font-size="28" fill="#718894">L2 / 极弱冷环境</text><text x="825" y="512" font-size="22" fill="#e8e4d9">东方开缝宽冷光，只分离东肩与木面；不变成第</text><text x="825" y="546" font-size="22" fill="#e8e4d9">二盏主灯。无无动机正面补光。</text><text x="90" y="788" font-size="23" fill="#e8e4d9">曝光意图：暗部仍读出手与皮，灯焰保层次；无照度或光比实测。</text></svg>
