<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="02 配色卡｜矿灰为底，缺口木色为强调"><defs><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#625a50"/><path d="M0 3H12 M3 0V12" stroke="#8b8172" opacity=".4"/></pattern><pattern id="bark" width="26" height="80" patternUnits="userSpaceOnUse"><rect width="26" height="80" fill="#45433d"/><path d="M7 0L12 27 5 60 10 80 M23 0L18 45 25 80" fill="none" stroke="#817b69" stroke-width="3"/></pattern><linearGradient id="light"><stop stop-color="#171e26"/><stop offset="1" stop-color="#cbd4da"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#bdcedb"/></marker></defs><rect width="1200" height="780" fill="#111821"/><text x="44" y="55" font-size="30" fill="#dce1e4">02 配色卡｜矿灰为底，缺口木色为强调</text><text x="44" y="89" font-size="17" fill="#aab5bf">吴刚伐桂 · G1 / r1 · 原创矢量设计示意，非 AI 样片</text><rect x="45" y="145" width="208" height="210" rx="8" fill="#626972"/><text x="45" y="390" font-size="23" fill="#dce1e4">P1 月尘</text><text x="45" y="425" font-size="21" fill="#dce1e4">#626972</text><text x="45" y="460" font-size="16" fill="#dce1e4">45% · 地表/空间中性</text><rect x="273" y="145" width="208" height="210" rx="8" fill="#171e26"/><text x="273" y="390" font-size="23" fill="#dce1e4">P2 深影</text><text x="273" y="425" font-size="21" fill="#dce1e4">#171E26</text><text x="273" y="460" font-size="16" fill="#dce1e4">25% · 背景/背光</text><rect x="501" y="145" width="208" height="210" rx="8" fill="#625a50"/><text x="501" y="390" font-size="23" fill="#dce1e4">P3 灰褐布</text><text x="501" y="425" font-size="21" fill="#dce1e4">#625A50</text><text x="501" y="460" font-size="16" fill="#dce1e4">15% · 人物衣装</text><rect x="729" y="145" width="208" height="210" rx="8" fill="#45433d"/><text x="729" y="390" font-size="23" fill="#dce1e4">P4 树皮/岩</text><text x="729" y="425" font-size="21" fill="#dce1e4">#45433D</text><text x="729" y="460" font-size="16" fill="#dce1e4">10% · 固定锚点</text><rect x="957" y="145" width="208" height="210" rx="8" fill="#a99b82"/><text x="957" y="390" font-size="23" fill="#dce1e4">P5 暴露木质</text><text x="957" y="425" font-size="21" fill="#dce1e4">#A99B82</text><text x="957" y="460" font-size="16" fill="#dce1e4">5% · 缺口强调</text><rect x="45" y="514" width="1115" height="28" fill="url(#light)"/><text x="45" y="585" font-size="20" fill="#dce1e4">面积为代表性环境测试图的设计目标，非每镜强制占比；五项合计 100%。</text><text x="45" y="616" font-size="20" fill="#dce1e4">肤色保护：皮肤维持低彩自然灰棕，不漂蓝、不染蜡黄；人物近景不套环境面积比例。</text><text x="45" y="647" font-size="20" fill="#dce1e4">只有同一月面状态；S0→S2 不改全局色温、曝光与饱和度，亮木色面积随缺口缩小。</text><text x="45" y="678" font-size="20" fill="#dce1e4">HEX 是 sRGB 屏幕设计预览；非实测反射率、非 LUT，未做校准监看或模型控制保证。</text><text x="44" y="746" font-size="17" fill="#9faebc">设计已绘制 / 待审    |    媒体未提供 pending_media    |    仅本次一次斧落后的缺口与复合</text></svg>