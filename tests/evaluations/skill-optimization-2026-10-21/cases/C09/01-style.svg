<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="01 风格卡｜沉默矿灰 · 木体自合"><defs><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#625a50"/><path d="M0 3H12 M3 0V12" stroke="#8b8172" opacity=".4"/></pattern><pattern id="bark" width="26" height="80" patternUnits="userSpaceOnUse"><rect width="26" height="80" fill="#45433d"/><path d="M7 0L12 27 5 60 10 80 M23 0L18 45 25 80" fill="none" stroke="#817b69" stroke-width="3"/></pattern><linearGradient id="light"><stop stop-color="#171e26"/><stop offset="1" stop-color="#cbd4da"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#bdcedb"/></marker></defs><rect width="1200" height="780" fill="#111821"/><text x="44" y="55" font-size="30" fill="#dce1e4">01 风格卡｜沉默矿灰 · 木体自合</text><text x="44" y="89" font-size="17" fill="#aab5bf">吴刚伐桂 · G1 / r1 · 原创矢量设计示意，非 AI 样片</text><rect x="45" y="130" width="610" height="375" rx="8" fill="#080d13"/><path d="M45 455Q310 430 655 465V505H45Z" fill="#626972"/><path d="M280 365L320 335 400 350 437 407 271 408Z" fill="#454b52"/><path d="M408 400L412 242 365 195 382 180 431 218 474 150 487 163 450 242 454 400Z" fill="url(#bark)"/><path d="M418 340L446 333 446 358Z" fill="#b3a184"/><path d="M423 344L447 340 445 354Z" fill="#0b1016"/><circle cx="348" cy="335" r="16" fill="#8c8072"/><path d="M332 351L362 351 374 410 325 410Z" fill="#625a50"/><path d="M335 405L332 454 M359 405L366 454" stroke="#625a50" stroke-width="14"/><path d="M369 380L390 421" stroke="#776550" stroke-width="7"/><path d="M380 411L401 410 404 424 392 431Z" fill="#717b84"/><path d="M625 200H520" stroke="#bdcedb" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="180" font-size="18" fill="#dce1e4">东侧冷白 → 西向</text><text x="70" y="490" font-size="18" fill="#dce1e4">月面 / 同一桂树 / 成年男子 / 北侧巨岩</text><text x="695" y="157" font-size="19" fill="#dce1e4">媒介：写实 CG，摄影式材质与体积</text><text x="695" y="188" font-size="19" fill="#dce1e4">叙事用途：让缺口读得出，复合可信</text><text x="695" y="219" font-size="19" fill="#dce1e4">形体：自然树干与粗布劳动者</text><text x="695" y="250" font-size="19" fill="#dce1e4">边缘：外轮廓清楚；暗部不描白边</text><text x="695" y="281" font-size="19" fill="#dce1e4">表面：干燥、低反光，木纤维可辨</text><text x="695" y="312" font-size="19" fill="#dce1e4">色光：低彩灰褐；冷白侧光</text><text x="695" y="343" font-size="19" fill="#dce1e4">时间：S0 空缺 → S1 复合 → S2 平复</text><text x="695" y="374" font-size="19" fill="#dce1e4">复合不发光，不长新枝，不重复砍</text><rect x="75" y="545" width="150" height="125" rx="7" fill="url(#bark)"/><path d="M118 598L187 579.0V617.0Z" fill="#0a1017" stroke="#a99b82" stroke-width="3"/><text x="89" y="702" font-size="21" fill="#dce1e4">S0 空缺</text><rect x="269" y="545" width="150" height="125" rx="7" fill="url(#bark)"/><path d="M312 598L381 589.5V606.5Z" fill="#0a1017" stroke="#a99b82" stroke-width="3"/><text x="283" y="702" font-size="21" fill="#dce1e4">S1 合拢</text><rect x="463" y="545" width="150" height="125" rx="7" fill="url(#bark)"/><text x="477" y="702" font-size="21" fill="#dce1e4">S2 平复</text><text x="695" y="570" font-size="18" fill="#dce1e4">不新增宫殿、嫦娥、兔或第二棵树。</text><text x="695" y="601" font-size="18" fill="#dce1e4">不以闪光、烟雾或切镜遮住复合。</text><text x="695" y="632" font-size="18" fill="#dce1e4">图中的三态是设计分解，非实测帧。</text><text x="44" y="746" font-size="17" fill="#9faebc">设计已绘制 / 待审    |    媒体未提供 pending_media    |    仅本次一次斧落后的缺口与复合</text></svg>