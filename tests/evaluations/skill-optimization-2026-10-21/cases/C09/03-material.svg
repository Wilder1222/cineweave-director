<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="03 材质卡｜干燥表面与可辨结构"><defs><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#625a50"/><path d="M0 3H12 M3 0V12" stroke="#8b8172" opacity=".4"/></pattern><pattern id="bark" width="26" height="80" patternUnits="userSpaceOnUse"><rect width="26" height="80" fill="#45433d"/><path d="M7 0L12 27 5 60 10 80 M23 0L18 45 25 80" fill="none" stroke="#817b69" stroke-width="3"/></pattern><linearGradient id="light"><stop stop-color="#171e26"/><stop offset="1" stop-color="#cbd4da"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#bdcedb"/></marker></defs><rect width="1200" height="780" fill="#111821"/><text x="44" y="55" font-size="30" fill="#dce1e4">03 材质卡｜干燥表面与可辨结构</text><text x="44" y="89" font-size="17" fill="#aab5bf">吴刚伐桂 · G1 / r1 · 原创矢量设计示意，非 AI 样片</text><rect x="45" y="135" width="350" height="120" rx="8" fill="#8c8072"/><text x="45" y="286" font-size="23" fill="#dce1e4">M1 皮肤</text><text x="45" y="318" font-size="17" fill="#dce1e4">毛孔与细纹；半哑光；不磨平</text><rect x="430" y="135" width="350" height="120" rx="8" fill="url(#weave)"/><text x="430" y="286" font-size="23" fill="#dce1e4">M2 灰褐粗布</text><text x="430" y="318" font-size="17" fill="#dce1e4">约 1–2 mm 织纹；折叠厚实</text><rect x="815" y="135" width="350" height="120" rx="8" fill="url(#bark)"/><text x="815" y="286" font-size="23" fill="#dce1e4">M3 桂树树皮</text><text x="815" y="318" font-size="17" fill="#dce1e4">纵裂约 2–8 mm；干而不脆亮</text><rect x="45" y="355" width="350" height="120" rx="8" fill="#a99b82"/><path d="M60 385l310 7 M57 405l280 10 M70 435l300 -9" stroke="#776550" fill="none"/><text x="45" y="506" font-size="23" fill="#dce1e4">M4 缺口木质</text><text x="45" y="538" font-size="17" fill="#dce1e4">顺纹纤维约 0.5–2 mm；无汁液</text><rect x="430" y="355" width="350" height="120" rx="8" fill="#626972"/><path d="M475 455l80 -78 130 28 55 58Z" fill="#454b52"/><text x="430" y="506" font-size="23" fill="#dce1e4">M5 月壤/巨岩</text><text x="430" y="538" font-size="17" fill="#dce1e4">细粉/厘米棱面；均为哑光</text><rect x="815" y="355" width="350" height="120" rx="8" fill="#717b84"/><path d="M875 445l240 -60" stroke="#776550" stroke-width="15"/><path d="M1055 380l65 -5 -5 50 -45 -10Z" fill="#b6c1c8"/><text x="815" y="506" font-size="23" fill="#dce1e4">M6 铁斧/木柄</text><text x="815" y="538" font-size="17" fill="#dce1e4">铁刃窄冷亮；木柄磨损油润</text><text x="45" y="625" font-size="19" fill="#dce1e4">基色与反射分离：浅木来自切面本色；铁刃亮来自 L_E 反射，二者都不自发光。</text><text x="45" y="656" font-size="19" fill="#dce1e4">冷光下保留灰褐底色；无暖光场景变体。大景看形与亮面，近景才评微纹理。</text><text x="45" y="687" font-size="19" fill="#dce1e4">复合时内部木纤维先桥接、空腔逐渐变浅、树皮两缘接续；不把整干换成塑料表面。</text><text x="44" y="746" font-size="17" fill="#9faebc">设计已绘制 / 待审    |    媒体未提供 pending_media    |    仅本次一次斧落后的缺口与复合</text></svg>