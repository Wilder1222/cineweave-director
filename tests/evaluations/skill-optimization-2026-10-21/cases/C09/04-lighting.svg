<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="04 灯光卡｜L_E 唯一东侧冷白环境光"><defs><pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#625a50"/><path d="M0 3H12 M3 0V12" stroke="#8b8172" opacity=".4"/></pattern><pattern id="bark" width="26" height="80" patternUnits="userSpaceOnUse"><rect width="26" height="80" fill="#45433d"/><path d="M7 0L12 27 5 60 10 80 M23 0L18 45 25 80" fill="none" stroke="#817b69" stroke-width="3"/></pattern><linearGradient id="light"><stop stop-color="#171e26"/><stop offset="1" stop-color="#cbd4da"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#bdcedb"/></marker></defs><rect width="1200" height="780" fill="#111821"/><text x="44" y="55" font-size="30" fill="#dce1e4">04 灯光卡｜L_E 唯一东侧冷白环境光</text><text x="44" y="89" font-size="17" fill="#aab5bf">吴刚伐桂 · G1 / r1 · 原创矢量设计示意，非 AI 样片</text><rect x="45" y="145" width="560" height="390" rx="8" fill="url(#light)"/><ellipse cx="324" cy="320" rx="85" ry="125" fill="#756f65"/><path d="M324 195Q402 205 410 320Q401 434 324 445Z" fill="#b2aca0"/><path d="M324 195Q245 212 240 320Q250 427 324 445Z" fill="#3d4144"/><path d="M580 260H450" stroke="#e6edf3" stroke-width="5" marker-end="url(#arrow)"/><text x="67" y="182" font-size="18" fill="#dce1e4">受光示意：不是实测照度图</text><text x="65" y="507" font-size="20" fill="#dce1e4">西：保留暗部体积          东：冷白宽侧光</text><text x="647" y="157" font-size="19" fill="#dce1e4">L_E：唯一东侧冷白环境光</text><text x="647" y="188" font-size="19" fill="#dce1e4">世界 +X → -X；设计仰角约 15°</text><text x="647" y="219" font-size="19" fill="#dce1e4">光源在画外；不指定新增天体</text><text x="647" y="250" font-size="19" fill="#dce1e4">宽方向性光：影缘轻柔仍有方向</text><text x="647" y="281" font-size="19" fill="#dce1e4">主光＝环境光；无独立辅光/轮廓灯</text><text x="647" y="312" font-size="19" fill="#dce1e4">地面微弱反射只继承 L_E 能量</text><text x="647" y="343" font-size="19" fill="#dce1e4">树创、斧刃、岩石均无发光</text><text x="647" y="374" font-size="19" fill="#dce1e4">影子向西，不随摄影机翻转</text><text x="45" y="590" font-size="19" fill="#dce1e4">曝光目标：东侧铁刃不爆白；西侧布衣折叠可分；缺口空腔最暗而不是纯黑洞。</text><text x="45" y="621" font-size="19" fill="#dce1e4">无新增补光设备或魔法光。若脸太暗，先调整取景与曝光，不从西侧补一盏灯。</text><text x="45" y="652" font-size="19" fill="#dce1e4">设计预览白平衡 5600 K、光色意图约 6500 K；数值仅为沟通起点，非实测光谱。</text><text x="45" y="683" font-size="19" fill="#dce1e4">S0/S1/S2 曝光保持；不以闪光或整体提亮表示复合。</text><text x="44" y="746" font-size="17" fill="#9faebc">设计已绘制 / 待审    |    媒体未提供 pending_media    |    仅本次一次斧落后的缺口与复合</text></svg>