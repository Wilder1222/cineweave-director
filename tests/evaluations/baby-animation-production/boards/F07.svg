30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">宝宝的寻找被爷爷接收到，第一次露面慢</tspan><tspan x="338" dy="20.72">慢发生。</tspan></text><rect x="648" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 498.16H902" stroke="#d0c9bc"/><circle cx="695.88" cy="280.48" r="17" fill="#e8bca6" stroke="#786252"/><path d="M679.88 302.48Q695.88 295.48 711.88 302.48L718.88 328.48H672.88Z" fill="#88a4b0" stroke="#8d8b83"/><rect x="718.42" y="327.4" width="56" height="30" rx="7" fill="#cad4bc" stroke="#879b7e"/><circle cx="850.16" cy="436.24" r="20" fill="#e8bca6" stroke="#786252"/><path d="M834.16 458.24Q850.16 451.24 866.16 458.24L873.16 484.24H827.16Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="717.88" cy="260.48" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="717.88" y="265.48" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="717.88" dy="0">1</tspan></text><text x="648" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">1. 爷爷·改从西边露面</tspan></text><circle cx="768.42" cy="312.4" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="768.42" y="317.4" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="768.42" dy="0">2</tspan></text><text x="648" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">2. 报纸·两侧完整</tspan></text><circle cx="872.16" cy="416.24" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="872.16" y="421.24" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="872.16" dy="0">3</tspan></text><text x="648" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">3. 澈澈·找错后看见</tspan></text><text x="648" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">F07-S03 · 8 秒</tspan></text><text x="648" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">第二次改边让游戏被宝宝继续参与，保留</tspan><tspan x="648" dy="20.72">一拍找错再找见。</tspan></text><rect x="28" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M40 1278.16H282" stroke="#d0c9bc"/><circle cx="107.8" cy="1088.8" r="17" fill="#e8bca6" stroke="#786252"/><path d="M91.8 1110.8Q107.8 1103.8 123.8 1110.8L130.8 1136.8H84.8Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="219.52" cy="1206.8" r="20" fill="#e8bca6" stroke="#786252"/><path d="M203.52 1228.8Q219.52 1221.8 235.52 1228.8L242.52 1254.8H196.52Z" fill="#eee5d6" stroke="#8d8b83"/><rect x="82.46" y="1201.8" width="56" height="30" rx="7" fill="#cad4bc" stroke="#879b7e"/><path d="M219.52 1149.6Q194.52 1139.6 184.52 1154.6V1191.6Q199.52 1181.6 219.52 1191.6Q239.52 1181.6 254.52 1191.6V1154.6Q244.52 1139.6 219.52 1149.6" fill="#a2b29b" stroke="#59715d"/><circle cx="129.8" cy="1068.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="129.8" y="1073.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="129.8" dy="0">1</tspan></text><text x="28" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">1. 爷爷·膝上折报抬眼</tspan></text><circle cx="241.52" cy="1186.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="241.52" y="1191.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="241.52" dy="0">2</tspan></text><text x="28" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">2. 澈澈·双手举书挡眼</tspan></text><circle cx="132.45999999999998" cy="1186.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="132.45999999999998" y="1191.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="132.45999999999998" dy="0">3</tspan></text><text x="28" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">3. 报纸·膝上</tspan></text><circle cx="241.52" cy="1139.6" r