" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. P05·跟向东挡</tspan></text><circle cx="588.76" cy="1163.2" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="588.76" y="1168.2" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="588.76" dy="0">3</tspan></text><text x="338" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">3. 澈澈·书东边露一眼</tspan></text><circle cx="437.14" cy="1238.72" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="437.14" y="1243.72" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="437.14" dy="0">4</tspan></text><text x="338" y="1593" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">4. 报纸·爷爷膝上</tspan></text><text x="338" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="338" dy="0">F07-S05 · 7 秒</tspan></text><text x="338" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">爷爷识别邀请后用探身来回应，宝宝的书</tspan><tspan x="338" dy="20.72">也会慢慢跟着挡。</tspan></text><rect x="648" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 1278.16H902" stroke="#d0c9bc"/><circle cx="730.46" cy="1088.8" r="17" fill="#e8bca6" stroke="#786252"/><path d="M714.46 1110.8Q730.46 1103.8 746.46 1110.8L753.46 1136.8H707.46Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="839.52" cy="1206.8" r="20" fill="#e8bca6" stroke="#786252"/><path d="M823.52 1228.8Q839.52 1221.8 855.52 1228.8L862.52 1254.8H816.52Z" fill="#eee5d6" stroke="#8d8b83"/><path d="M839.52 1277.04Q814.52 1267.04 804.52 1282.04V1319.04Q819.52 1309.04 839.52 1319.04Q859.52 1309.04 874.52 1319.04V1282.04Q864.52 1267.04 839.52 1277.04" fill="#a2b29b" stroke="#59715d"/><rect x="702.46" y="1201.8" width="56" height="30" rx="7" fill="#cad4bc" stroke="#879b7e"/><circle cx="752.46" cy="1068.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="752.46" y="1073.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="752.46" dy="0">1</tspan></text><text x="648" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">1. 爷爷·报纸留膝上</tspan></text><circle cx="861.52" cy="1186.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="861.52" y="1191.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="861.52" dy="0">2</tspan></text><text x="648" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">2. 澈澈·放书后笑</tspan></text><circle cx="861.52" cy="1267.04" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="861.52" y="1272.04" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="861.52" dy="0">3</tspan></text><text x="648" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">3. P05·回腿上</tspan></text><circle cx="752.46" cy="1186.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="752.46" y="1191.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="752.46" dy="0">4</tspan></text><text x="648" y="1593" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">4. 报纸·尚未再翻</tspan></text><text x="648" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">F07-S06 · 7 秒</tspan></text><text x="648" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">轮到宝宝被找到，读报暂缓但不被宣布成</tspan><tspan x="648" dy="20.72">牺牲与道理。</tspan></text></g></svg>