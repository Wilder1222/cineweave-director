<text x="42" y="88" fill="#67757a" font-size="15" font-weight="400" text-anchor="start"><tspan x="42" dy="0">9:16 构图与位置示意；动作、接触和画外继承以逐镜卡为准；非生成关键帧</tspan></text><rect x="28" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M40 498.16H282" stroke="#d0c9bc"/><circle cx="161.0" cy="393.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M145.0 415.76Q161.0 408.76 177.0 415.76L184.0 441.76H138.0Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="243.46" cy="356.0" r="17" fill="#e8bca6" stroke="#786252"/><path d="M227.46 378.0Q243.46 371.0 259.46000000000004 378.0L266.46000000000004 404.0H220.46Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="75.88" cy="337.12" r="17" fill="#e8bca6" stroke="#786252"/><path d="M59.879999999999995 359.12Q75.88 352.12 91.88 359.12L98.88 385.12H52.879999999999995Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="183.0" cy="373.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="183.0" y="378.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="183.0" dy="0">1</tspan></text><text x="28" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">1. 澈澈·稳坐</tspan></text><circle cx="265.46000000000004" cy="336.0" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="265.46000000000004" y="341.0" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="265.46000000000004" dy="0">2</tspan></text><text x="28" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">2. 妈妈·等看过来</tspan></text><circle cx="97.88" cy="317.12" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="97.88" y="322.12" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="97.88" dy="0">3</tspan></text><text x="28" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">3. 爸爸·西侧</tspan></text><text x="28" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="28" dy="0">G11-S01 · 6 秒</tspan></text><text x="28" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="28" dy="0">建立两个称呼将指向的同一位爸爸及稳定</tspan><tspan x="28" dy="20.72">空间。</tspan></text><rect x="338" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M350 498.16H592" stroke="#d0c9bc"/><circle cx="455.04" cy="393.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M439.04 415.76Q455.04 408.76 471.04 415.76L478.04 441.76H432.04Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="556.12" cy="341.84000000000003" r="17" fill="#e8bca6" stroke="#786252"/><path d="M540.12 363.84000000000003Q556.12 356.84000000000003 572.12 363.84000000000003L579.12 389.84000000000003H533.12Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="361.94" cy="313.52" r="17" fill="#e8bca6" stroke="#786252"/><path d="M345.94 335.52Q361.94 328.52 377.94 335.52L384.94 361.52H338.94Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="477.04" cy="373.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="477.04" y="378.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="477.04" dy="0">1</tspan></text><text x="338" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">1. 澈澈·转向西</tspan></text><circle cx="578.12" cy="321.84000000000003" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="578.12" y="326.84000000000003" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="578.12" dy="0">2</tspan></text><text x="338" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. 妈妈·问后停声</tspan></text><circle cx="383.94" cy="293.52" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="383.94" y="298.52" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="383.94" dy="0">3</tspan></text><text x="338" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">3. 爸爸·画外西侧</tspan></text><text x="338" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="338" dy="0">G11-S02 · 6 秒</tspan></text><text x="338" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">让第一声称呼成为宝宝寻找目标的明确触</tspan><tspan x="338" dy="20.72">发。</tspan></text><rect x="648" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 498.16H902" stroke="#d0c9bc"/><circle cx="695.88" cy="327.68" r="17" fill="#e8bca6" stroke="#786252"/><path d="M679.88 349.68Q695.88 342.68 711.88 349.68L718.88 375.68H672.88Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="781.0" cy="393.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M765.0 415.76Q781.0 408.76 797.0 415.76L804.0 441.76H758.0Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="866.12" cy="351.28" r="17" fill="#e8bca6" stroke="#786252"/><path d="M850.12 373.28Q866.12 366.28 882.12 373.28L889.12 399.28H843.12Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="717.88" cy="307.68" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="717.88" y="312.68" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="717.88" dy="0">1</tspan></text><text x="648" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">1. 爸爸·收到指认后笑</tspan></text><circle cx="803.0" cy="373.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="803.0" y="378.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="803.0" dy="0">2</tspan></text><text x="648" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">2. 澈澈·右手指后收回</tspan></text><circle cx="888.12" cy="331.28" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="888.12" y="336.28" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="888.12" dy="0">3</tspan></text><text x="648" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">3. 妈妈·等候</tspan></text><text x="648" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">G11-S03 · 6 秒</tspan></text><text x="648" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">把第一轮指认读清，并为第二轮真正重置</tspan><tspan x="648" dy="20.72">空手状态。</tspan></text><rect x="28" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M40 1278.16H282" stroke="#d0c9bc"/><circle cx="145.04000000000002" cy="1173.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M129.04000000000002 1195.76Q145.04000000000002 1188.76 161.04000000000002 1195.76L168.04000000000002 1221.76H122.04000000000002Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="246.12" cy="1121.84" r="17" fill="#e8bca6" stroke="#786252"/><path d="M230.12 1143.84Q246.12 1136.84 262.12 1143.84L269.12 1169.84H223.12Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="51.94" cy="1093.52" r="17" fill="#e8bca6" stroke="#786252"/><path d="M35.94 1115.52Q51.94 1108.52 67.94 1115.52L74.94 1141.52H28.939999999999998Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="167.04000000000002" cy="1153.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="167.04000000000002" y="1158.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="167.04000000000002" dy="0">1</tspan></text><text x="28" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">1. 澈澈·听到另一称呼</tspan></text><circle cx="268.12" cy="1101.84" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="268.12" y="1106.84" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="268.12" dy="0">2</tspan></text><text x="28" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">2. 妈妈·换称呼</tspan></text><circle cx="73.94" cy="1073.52" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="73.94" y="1078.52" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="73.94" dy="0">3</tspan></text><text x="28" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">3. 爸爸·画外原位</tspan></text><text x="28" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="28" dy="0">G11-S04 · 6 秒</tspan></text><text x="28" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="28" dy="0">换称呼而保持问题对象和空间，留出倾听</tspan><tspan x="28" dy="20.72">。</tspan></text><rect x="338" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M350 1278.16H592" stroke="#d0c9bc"/><circle cx="385.88" cy="1107.68" r="17" fill="#e8bca6" stroke="#786252"/><path d="M369.88 1129.68Q385.88 1122.68 401.88 1129.68L408.88 1155.68H362.88Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="471.0" cy="1173.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M455.0 1195.76Q471.0 1188.76 487.0 1195.76L494.0 1221.76H448.0Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="556.12" cy="1131.28" r="17" fill="#e8bca6" stroke="#786252"/><path d="M540.12 1153.28Q556.12 1146.28 572.12 1153.28L579.12 1179.28H533.12Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="407.88" cy="1087.68" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="407.88" y="1092.68" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="407.88" dy="0">1</tspan></text><text x="338" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">1. 爸爸·仍是同一人</tspan></text><circle cx="493.0" cy="1153.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="493.0" y="1158.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="493.0" dy="0">2</tspan></text><text x="338" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. 澈澈·再次指西侧</tspan>