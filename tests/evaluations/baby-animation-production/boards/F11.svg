 stroke="#7e898b"/><text x="882.8" y="1191.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="882.8" dy="0">4</tspan></text><text x="648" y="1593" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">4. 低靠垫·承背</tspan></text><text x="648" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">F11-S06 · 5 秒</tspan></text><text x="648" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">让两人把同一阵笑自然笑完、恢复呼吸，</tspan><tspan x="648" dy="20.72">以安静对看收束，不添加第三次遮脸。</tspan></text></g></svg>