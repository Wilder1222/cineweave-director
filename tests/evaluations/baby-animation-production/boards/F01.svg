<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="54" fill="#30383b" font-size="30" font-weight="700" text-anchor="start"><tspan x="42" dy="0">F01《这个才好笑》分镜构图板</tspan></text>
<text x="42" y="88" fill="#67757a" font-size="15" font-weight="400" text-anchor="start"><tspan x="42" dy="0">9:16 构图与位置示意；动作、接触和画外继承以逐镜卡为准；非生成关键帧</tspan></text><rect x="28" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M40 498.16H282" stroke="#d0c9bc"/><circle cx="105.14" cy="389.04" r="17" fill="#e8bca6" stroke="#786252"/><path d="M89.14 411.04Q105.14 404.04 121.14 411.04L128.14 437.04H82.14Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="208.88" cy="412.64" r="20" fill="#e8bca6" stroke="#786252"/><path d="M192.88 434.64Q208.88 427.64 224.88 434.64L231.88 460.64H185.88Z" fill="#eee5d6" stroke="#8d8b83"/><rect x="132.3" y="220.28" width="84" height="48" rx="8" fill="#d4dedf" stroke="#66797e" stroke-width="2"/><circle cx="127.14" cy="369.04" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="127.14" y="374.04" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="127.14" dy="0">1</tspan></text><text x="28" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">1. 爸爸·鼓腮</tspan></text><circle cx="230.88" cy="392.64" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="230.88" y="397.64" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="230.88" dy="0">2</tspan></text><text x="28" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">2. 澈澈·认真看</tspan></text><circle cx="196.3" cy="213.28" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="196.3" y="218.28" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="196.3" dy="0">3</tspan></text><text x="28" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">3. 北墙沙发</tspan></text><text x="28" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="28" dy="0">F01-S01 · 7 秒</tspan></text><text x="28" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="28" dy="0">建立两人的相对位置与爸爸主动逗笑、澈</tspan><tspan x="28" dy="20.72">澈认真观看的关系。</tspan></text><rect x="338" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M350 498.16H592" stroke="#d0c9bc"/><circle cx="449.72" cy="318.24" r="17" fill="#e8bca6" stroke="#786252"/><path d="M433.72 340.24Q449.72 333.24 465.72 340.24L472.72 366.24H426.72Z" fill="#88a4b0" stroke="#8d8b83"/><circle cx="569.42" cy="455.12" r="20" fill="#e8bca6" stroke="#786252"/><path d="M553.42 477.12Q569.42 470.12 585.42 477.12L592.42 503.12H546.42Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="471.72" cy="298.24" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="471.72" y="303.24" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="471.72" dy="0">1</tspan></text><text x="338" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">1. 爸爸·噘嘴后等待</tspan></text><circle cx="591" cy="435.12" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="591" y="440.12" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="591" dy="0">2</tspan></text><text x="338" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. 澈澈后脑·右前景</tspan></text><text x="338" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="338" dy="0">F01-S02 · 7 秒</tspan></text><text x="338" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">展示爸爸用力设计的第二个表情仍没有换</tspan><tspan x="338" dy="20.72">来笑声。</tspan></text><rect x="648" y="130" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 498.16H902" stroke="#d0c9bc"/><circle cx="815.58" cy="370.15999999999997" r="20" fill="#e8bca6" stroke="#786252"/><path d="M799.58 392.15999999999997Q815.58 385.15999999999997 831.58 392.15999999999997L838.58 418.15999999999997H792.58Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="695.88" cy="407.92" r="17" fill="#e8bca6" stroke="#786252"/><path d="M679.88 429.92Q695.88 422.92 711.88 429.92L718.88 455.92H672.88Z" fill="#c77c67" stroke="#8d8b83"/><ellipse cx="788.98" cy="526.48" rx="18" ry="13" fill="#e8bca6" stroke="#a57d67"/><circle cx="775.98" cy="515.48" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="783.98" cy="515.48" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="791.98" cy="515.48" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="799.98" cy="515.48" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="837.58" cy="350.15999999999997" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="837.58" y="355.15999999999997" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="837.58" dy="0">1</tspan></text><text x="648" y="747" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">1. 澈澈·追看双手</tspan></text><circle cx="717.88" cy="387.92" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="717.88" y="392.92" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="717.88" dy="0">2</tspan></text><text x="648" y="769" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">2. 爸爸肩与抬手</tspan></text><circle cx="810.98" cy="496.48" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="810.98" y="501.48" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="810.98" dy="0">3</tspan></text><text x="648" y="791" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">3. 澈澈左掌·撑垫</tspan></text><text x="648" y="630" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">F01-S03 · 7 秒</tspan></text><text x="648" y="657" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">让宝宝的专注与爸爸真正放松下来同时成</tspan><tspan x="648" dy="20.72">立，为无意表情留空隙。</tspan></text><rect x="28" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M40 1278.16H282" stroke="#d0c9bc"/><circle cx="107.8" cy="1112.4" r="17" fill="#e8bca6" stroke="#786252"/><path d="M91.8 1134.4Q107.8 1127.4 123.8 1134.4L130.8 1160.4H84.8Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="216.86" cy="1173.76" r="20" fill="#e8bca6" stroke="#786252"/><path d="M200.86 1195.76Q216.86 1188.76 232.86 1195.76L239.86 1221.76H193.86Z" fill="#eee5d6" stroke="#8d8b83"/><ellipse cx="240.8" cy="1315.92" rx="18" ry="13" fill="#e8bca6" stroke="#a57d67"/><circle cx="227.8" cy="1304.92" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="235.8" cy="1304.92" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="243.8" cy="1304.92" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="251.8" cy="1304.92" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="129.8" cy="1092.4" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="129.8" y="1097.4" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="129.8" dy="0">1</tspan></text><text x="28" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">1. 爸爸·掌根贴颊</tspan></text><circle cx="238.86" cy="1153.76" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="238.86" y="1158.76" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="238.86" dy="0">2</tspan></text><text x="28" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">2. 澈澈·开始笑</tspan></text><circle cx="262.8" cy="1285.92" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="262.8" y="1290.92" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="262.8" dy="0">3</tspan></text><text x="28" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">3. 澈澈右掌落垫</tspan></text><text x="28" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="28" dy="0">F01-S04 · 8 秒</tspan></text><text x="28" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="28" dy="0">无意揉脸形成真正刺激，宝宝在看清之后</tspan><tspan x="28" dy="20.72">才开始笑。</tspan></text><rect x="338" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M350 1278.16H592" stroke="#d0c9bc"/><circle cx="447.06" cy="1102.96" r="17" fill="#e8bca6" stroke="#786252"/><path d="M431.06 1124.96Q447.06 1117.96 463.06 1124.96L470.06 1150.96H424.06Z" fill="#88a4b0" stroke="#8d8b83"/><circle cx="561.44" cy="1211.52" r="20" fill="#e8bca6" stroke="#786252"/><path d="M545.44 1233.52Q561.44 1226.52 577.44 1233.52L584.44 1259.52H538.44Z" fill="#eee5d6" stroke="#8d8b83"/><circle cx="469.06" cy="1082.96" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="469.06" y="1087.96" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="469.06" dy="0">1</tspan></text><text x="338" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">1. 爸爸·先笑漏气</tspan></text><circle cx="583.44" cy="1191.52" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="583.44" y="1196.52" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="583.44" dy="0">2</tspan></text><text x="338" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. 澈澈·右前景笑脸</tspan></text><text x="338" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="338" dy="0">F01-S05 · 8 秒</tspan></text><text x="338" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">爸爸想复制那个无意的表情，却被宝宝的</tspan><tspan x="338" dy="20.72">笑先逗笑。</tspan></text><rect x="648" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 1278.16H902" stroke="#d0c9bc"/><circle cx="727.8" cy="1150.16" r="17" fill="#e8bca6" stroke="#786252"/><path d="M711.8 1172.16Q727.8 1165.16 743.8 1172.16L750.8 1198.16H704.8Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="831.54" cy="1187.92" r="20" fill="#e8bca6" stroke="#786252"/><path d="M815.54 1209.92Q831.54 1202.92 847.54 1209.92L854.54 1235.92H808.54Z" fill="#eee5d6" stroke="#8d8b83"/><rect x="754.96" y="1000.28" width="84" height="48" rx="8" fill="#d4dedf" stroke="#66797e" stroke-width="2"/><circle cx="749.8" cy="1130.16" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="749.8" y="1135.16" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="749.8" dy="0">1</tspan></text><text x="648" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">1. 爸爸·放松前倾</tspan></text><circle cx="853.54" cy="1167.92" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="853.54" y="1172.92" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="853.54" dy="0">2</tspan></text><text x="648" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">2. 澈澈·双掌回垫</tspan></text><circle cx="818.96" cy="993.28" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="818.96" y="998.28" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="818.96" dy="0">3</tspan></text><text x="648" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="648" dy="0">3. 北墙沙发</tspan></text><text x="648" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="648" dy="0">F01-S06 · 8 秒</tspan></text><text x="648" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="648" dy="0">以共同笑完而非再制造怪脸收束关系。</tspan></text></g></svg>