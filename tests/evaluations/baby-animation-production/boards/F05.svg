xt><text x="28" y="1593" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="28" dy="0">4. 固定沙发</tspan></text><text x="28" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="28" dy="0">F05-S04 · 6 秒</tspan></text><text x="28" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="28" dy="0">完整拍出乐段结束与妈妈停下，留下宝宝</tspan><tspan x="28" dy="20.72">尚未停住的差异。</tspan></text><rect x="338" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M350 1278.16H592" stroke="#d0c9bc"/><circle cx="415.14" cy="1136.0" r="17" fill="#e8bca6" stroke="#786252"/><path d="M399.14 1158.0Q415.14 1151.0 431.14 1158.0L438.14 1184.0H392.14Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="529.52" cy="1202.08" r="20" fill="#e8bca6" stroke="#786252"/><path d="M513.52 1224.08Q529.52 1217.08 545.52 1224.08L552.52 1250.08H506.52Z" fill="#eee5d6" stroke="#8d8b83"/><ellipse cx="425.78" cy="1334.8" rx="26" ry="13" fill="#e8bca6" stroke="#a57d67"/><circle cx="412.78" cy="1323.8" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="420.78" cy="1323.8" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="428.78" cy="1323.8" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><circle cx="436.78" cy="1323.8" r="4" fill="#e8bca6" stroke="#a57d67" stroke-width=".6"/><rect x="474.22" y="1047.48" width="84" height="48" rx="8" fill="#d4dedf" stroke="#66797e" stroke-width="2"/><circle cx="437.14" cy="1116.0" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="437.14" y="1121.0" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="437.14" dy="0">1</tspan></text><text x="338" y="1527" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">1. 妈妈·看见后重新轻点</tspan></text><circle cx="551.52" cy="1182.08" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="551.52" y="1187.08" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="551.52" dy="0">2</tspan></text><text x="338" y="1549" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">2. 澈澈·无音乐仍认真</tspan></text><circle cx="447.78" cy="1304.8" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="447.78" y="1309.8" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="447.78" dy="0">3</tspan></text><text x="338" y="1571" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">3. 妈妈脚尖·重新点地</tspan></text><circle cx="538.22" cy="1040.48" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="538.22" y="1045.48" fill="#30383b" font-size="13" font-weight="400" text-anchor="middle"><tspan x="538.22" dy="0">4</tspan></text><text x="338" y="1593" fill="#30383b" font-size="13" font-weight="400" text-anchor="start"><tspan x="338" dy="0">4. 宝宝持续扶住</tspan></text><text x="338" y="1410" fill="#30383b" font-size="19" font-weight="700" text-anchor="start"><tspan x="338" dy="0">F05-S05 · 6 秒</tspan></text><text x="338" y="1437" fill="#30383b" font-size="14" font-weight="400" text-anchor="start"><tspan x="338" dy="0">宝宝在无音乐时仍认真晃动，妈妈看见后</tspan><tspan x="338" dy="20.72">决定继续陪这一小段。</tspan></text><rect x="648" y="910" width="266" height="472" rx="8" fill="#f0ede6" stroke="#b8b2a8" stroke-width="2"/><path d="M660 1278.16H902" stroke="#d0c9bc"/><circle cx="727.8" cy="1121.84" r="17" fill="#e8bca6" stroke="#786252"/><path d="M711.8 1143.84Q727.8 1136.84 743.8 1143.84L750.8 1169.84H704.8Z" fill="#c77c67" stroke="#8d8b83"/><circle cx="836.86" cy="1202.08" r="20" fill="#e8bca6" stroke="#786252"/><path d="M820.86 1224.08Q836.86 1217.08 852.86 1224.08L859.86 1250.08H813.86Z" fill="#eee5d6" stroke="#8d8b83"/><rect x="770.92" y="1042.76" width="84" height="48" rx="8" fill="#d4dedf" stroke="#66797e" stroke-width="2"/><circle cx="749.8" cy="1101.84" r="11" fill="#faf7f1" stroke="#7e898b"/><text x="749.8" y="1106.84" fill="#30383b" font-size