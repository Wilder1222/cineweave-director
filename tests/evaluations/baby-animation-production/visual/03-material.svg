<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="G1 · 材质卡">
<defs><linearGradient id="skin"><stop stop-color="#f2d3bf"/><stop offset="1" stop-color="#dcae96"/></linearGradient>
<linearGradient id="soft"><stop stop-color="#e5dcd0"/><stop offset="1" stop-color="#c0b4a7"/></linearGradient>
<pattern id="cloth" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#eee5d6"/><path d="M0 2H9M2 0V9" stroke="#d8cdbd" stroke-width=".6"/></pattern>
<pattern id="wood" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="#c8ac89"/><path d="M0 6Q20 0 40 8M0 15Q20 21 40 13" fill="none" stroke="#a48767" stroke-width="1"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c77c67" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#faf7f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="54" fill="#30383b" font-size="30" font-weight="700" text-anchor="start"><tspan x="42" dy="0">G1 · 材质卡</tspan></text>
<text x="42" y="88" fill="#67757a" font-size="15" font-weight="400" text-anchor="start"><tspan x="42" dy="0">原创视觉设计提案 / 矢量示意；非生成电影帧、非实测光材</tspan></text><rect x="60" y="140" width="332" height="143" rx="16" fill="url(#skin)" stroke="#b7b0a8"/><text x="60" y="318" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="60" dy="0">M01 澈澈皮肤</tspan></text><text x="60" y="350" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="60" dy="0">宽柔亮部，保留面颊体积；避免塑料反光</tspan></text><rect x="440" y="140" width="332" height="143" rx="16" fill="url(#cloth)" stroke="#b7b0a8"/><text x="440" y="318" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="440" dy="0">M02 棉连体衣</tspan></text><text x="440" y="350" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="440" dy="0">细织纹、软折痕；不逐镜换针织结构</tspan></text><rect x="820" y="140" width="332" height="143" rx="16" fill="#d98c7c" stroke="#b7b0a8"/><text x="820" y="318" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="820" dy="0">M03 软布环 P01</tspan></text><text x="820" y="350" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="820" dy="0">可轻压变形，松手恢复；接触处有压痕</tspan></text><rect x="60" y="395" width="332" height="143" rx="16" fill="url(#wood)" stroke="#b7b0a8"/><text x="60" y="573" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="60" dy="0">M04 木盒 P07</tspan></text><text x="60" y="605" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="60" dy="0">钝边、低对比木纹；不反光抢脸</tspan></text><rect x="440" y="395" width="332" height="143" rx="16" fill="#5e6a6d" stroke="#b7b0a8"/><text x="440" y="573" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="440" dy="0">M05 车架 S01</tspan></text><text x="440" y="605" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="440" dy="0">稳定刚性结构，柔和窄高光</tspan></text><rect x="820" y="395" width="332" height="143" rx="16" fill="#a2b29b" stroke="#b7b0a8"/><text x="820" y="573" fill="#30383b" font-size="22" font-weight="700" text-anchor="start"><tspan x="820" dy="0">M06 布书 P05</tspan></text><text x="820" y="605" fill="#30383b" font-size="16" font-weight="400" text-anchor="start"><tspan x="820" dy="0">可翻布页，响纸页位置固定</tspan></text><text x="60" y="713" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="60" dy="0">图中是矢量响应示意。真实皮肤、织物与接触小样仍待生成；保持同一造型比较光照。</tspan></text></g></svg>