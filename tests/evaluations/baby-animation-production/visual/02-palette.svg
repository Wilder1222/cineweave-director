<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="G1 · 配色卡">
<defs><linearGradient id="skin"><stop stop-color="#f2d3bf"/><stop offset="1" stop-color="#dcae96"/></linearGradient>
<linearGradient id="soft"><stop stop-color="#e5dcd0"/><stop offset="1" stop-color="#c0b4a7"/></linearGradient>
<pattern id="cloth" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#eee5d6"/><path d="M0 2H9M2 0V9" stroke="#d8cdbd" stroke-width=".6"/></pattern>
<pattern id="wood" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="#c8ac89"/><path d="M0 6Q20 0 40 8M0 15Q20 21 40 13" fill="none" stroke="#a48767" stroke-width="1"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c77c67" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#faf7f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="54" fill="#30383b" font-size="30" font-weight="700" text-anchor="start"><tspan x="42" dy="0">G1 · 配色卡</tspan></text>
<text x="42" y="88" fill="#67757a" font-size="15" font-weight="400" text-anchor="start"><tspan x="42" dy="0">原创视觉设计提案 / 矢量示意；非生成电影帧、非实测光材</tspan></text><rect x="55" y="140" width="340" height="125" rx="12" fill="#eee5d6"/><text x="55" y="298" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="55" dy="0">C01 奶油  #EEE5D6</tspan></text><text x="55" y="331" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="55" dy="0">连体衣、地垫；留住织物细节</tspan></text><rect x="435" y="140" width="340" height="125" rx="12" fill="#c77c67"/><text x="435" y="298" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="435" dy="0">C02 砖陶  #C77C67</tspan></text><text x="435" y="331" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="435" dy="0">爸爸；家庭的暖色锚点</tspan></text><rect x="815" y="140" width="340" height="125" rx="12" fill="#88a4b0"/><text x="815" y="298" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="815" dy="0">C03 雾蓝  #88A4B0</tspan></text><text x="815" y="331" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="815" dy="0">妈妈、车座；与皮肤分离</tspan></text><rect x="55" y="385" width="340" height="125" rx="12" fill="#a2b29b"/><text x="55" y="543" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="55" dy="0">C04 鼠尾草  #A2B29B</tspan></text><text x="55" y="576" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="55" dy="0">积木与布书的辅助色</tspan></text><rect x="435" y="385" width="340" height="125" rx="12" fill="#d98c7c"/><text x="435" y="543" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="435" dy="0">C05 珊瑚  #D98C7C</tspan></text><text x="435" y="576" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="435" dy="0">软布环；关键道具强调</tspan></text><rect x="815" y="385" width="340" height="125" rx="12" fill="#e8bca6"/><text x="815" y="543" fill="#30383b" font-size="20" font-weight="700" text-anchor="start"><tspan x="815" dy="0">C06 肤色参考  #E8BCA6</tspan></text><text x="815" y="576" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="815" dy="0">预览设计值；随光自然变化</tspan></text><text x="55" y="690" fill="#30383b" font-size="17" font-weight="400" text-anchor="start"><tspan x="55" dy="0">色彩进程：好奇—轻暖中性；互动—道具点色清楚；休息—降低环境亮度而不丢脸部可读性。</tspan><tspan x="55" dy="25.16">HEX 为 sRGB 设计预览；不作为实测材质色、LUT 或精确模型控制。</tspan></text></g></svg>