<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" data-artifact-id="CW-SF-B-G3-BLOCKING" data-provenance="design_vector_not_generated_media" role="img"><rect x="0" y="0" width="1200" height="960" rx="0" fill="#111F28"/><text x="60" y="63" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" fill="#FFEDD3" font-weight="700">G3  ·  三人调度卡  /  BLOCKING</text><text x="60" y="99" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ADC5CE" font-weight="400">《雨停以后》 · 日常动作与视线管理，不制造戏剧冲突</text><text x="58" y="931" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9AAEB5" font-weight="400">CW-SF-B-G3-BLOCKING · 可审阅设计板 · 不代表真实影像已生成</text><rect x="55" y="148" width="1090" height="155" rx="14" fill="#20323B"/><text x="78" y="188" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#F7DFB7" font-weight="650">共同任务：三位成年好友选饮品、听见雨停，再一起走出南门</text><text x="78" y="229" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#F0F4F0" font-weight="400">动作链：看绿瓶 → 拿绿瓶 → 看雨后街景 → 拿黄/透明瓶 → 左手开门 → 过门槛</text><text x="78" y="270" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#A6CFD5" font-weight="400">不得添加误会、争吵、强制反转；饮料各归其主，门铃只响一次</text><rect x="55" y="328" width="1090" height="167" rx="14" fill="#20323B"/><text x="78" y="362" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D4AA" font-weight="700">C-L  角色行动任务</text><text x="78" y="399" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">目标：与朋友延续轻松相处</text><text x="78" y="429" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">策略：注意绿瓶提问、随后提议慢慢走</text><text x="78" y="464" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#BBD1DA" font-weight="400">触发：看见唐栀桌上的绿瓶与乔宁报天气</text><rect x="55" y="513" width="1090" height="167" rx="14" fill="#20323B"/><text x="78" y="547" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D4AA" font-weight="700">C-T  角色行动任务</text><text x="78" y="584" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">目标：用一句话回应熟悉朋友的关心</text><text x="78" y="614" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">策略：展示自己选的新口味，身体回应对方</text><text x="78" y="649" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#BBD1DA" font-weight="400">触发：林夏问青梅口味</text><rect x="55" y="698" width="1090" height="167" rx="14" fill="#20323B"/><text x="78" y="732" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D4AA" font-weight="700">C-Q  角色行动任务</text><text x="78" y="769" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">目标：感受到外面雨停并分享发现</text><text x="78" y="799" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#F0F4F0" font-weight="400">策略：观察窗外雨滴与光线，再自然通知朋友</text><text x="78" y="834" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#BBD1DA" font-weight="400">触发：雨滴稀疏与外景变亮</text></svg>