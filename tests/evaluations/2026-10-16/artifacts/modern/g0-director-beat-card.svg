<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" data-artifact-id="CW-SF-B-G0-DIRECTOR" data-provenance="design_vector_not_generated_media" role="img"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#111F28"/><text x="60" y="63" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" fill="#FFEDD3" font-weight="700">G0  ·  导演故事卡  /  DIRECTOR &amp; BEATS</text><text x="60" y="99" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ADC5CE" font-weight="400">《雨停以后》 · 无强加冲突；剧本另见 G0.sceneScript</text><text x="58" y="871" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9AAEB5" font-weight="400">CW-SF-B-G0-DIRECTOR · 可审阅设计板 · 不代表真实影像已生成</text><rect x="55" y="140" width="1090" height="150" rx="14" fill="#20323B"/><text x="74" y="174" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#D9B381" font-weight="700">导演意图  /  DIRECTOR STATEMENT</text><text x="74" y="211" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">在没有冲突、反转与紧迫命令的情况下，观察三个朋友闲聊、拿起各自饮品、一起经过店门，并以雨后街道和共同停留收</text><text x="74" y="236" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">束。摄影以少量固定机位、一个必要的跟随移动及空间声音维持关系。</text><text x="74" y="261" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400"></text><rect x="55" y="320" width="536" height="138" rx="14" fill="#20323B"/><text x="73" y="355" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B1   共同看窗景与桌面饮料</text><text x="73" y="394" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：窗外细雨敲玻璃</text><text x="73" y="426" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：理解三人相熟与连续空间</text><rect x="608" y="320" width="536" height="138" rx="14" fill="#20323B"/><text x="626" y="355" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B2   林夏问唐栀</text><text x="626" y="394" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：惯常口味引起轻松好奇</text><text x="626" y="426" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：熟悉对方小习惯的亲近</text><rect x="55" y="474" width="536" height="138" rx="14" fill="#20323B"/><text x="73" y="509" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B3   唐栀右手真实拿起绿瓶</text><text x="73" y="548" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：唐栀回应口味</text><text x="73" y="580" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：人物通过动作和一句话被辨认</text><rect x="608" y="474" width="536" height="138" rx="14" fill="#20323B"/><text x="626" y="509" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B4   乔宁看向原先就存在的南门街景</text><text x="626" y="548" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：窗外雨滴变稀，天空发亮</text><text x="626" y="580" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：从店内亲密观察转向外部天气</text><rect x="55" y="628" width="536" height="138" rx="14" fill="#20323B"/><text x="73" y="663" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B5   林夏回应、两人拿各自瓶，三人往南门移动</text><text x="73" y="702" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：乔宁说雨停</text><text x="73" y="734" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：决定不是冲突解决，而是活动自然继续</text><rect x="608" y="628" width="536" height="138" rx="14" fill="#20323B"/><text x="626" y="663" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F2D8AC" font-weight="650">B-B6   三人经过同一门槛，在屋檐下驻足</text><text x="626" y="702" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F0F4F0" font-weight="400">刺激：雨停的空气与夕光</text><text x="626" y="734" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#AFC7D1" font-weight="400">观众获得：以陪伴和感知完成短片</text></svg>