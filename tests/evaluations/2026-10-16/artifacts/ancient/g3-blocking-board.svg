<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" data-artifact-id="CW-SF-A-G3-BLOCKING" data-provenance="design_vector_not_generated_media" role="img"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#111F28"/><text x="60" y="63" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" fill="#FFEDD3" font-weight="700">G3  ·  走位与表演卡  /  BLOCKING</text><text x="60" y="99" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ADC5CE" font-weight="400">《雨汛前夜》 · 按刺激、行动、物件归属而非按微表情堆砌</text><text x="58" y="871" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9AAEB5" font-weight="400">CW-SF-A-G3-BLOCKING · 可审阅设计板 · 不代表真实影像已生成</text><rect x="55" y="148" width="1090" height="175" rx="14" fill="#20323B"/><text x="78" y="188" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#F7DFB7" font-weight="650">调度轴：桌南沈砚（右手持木匣） ⇄ 桌北顾从远（账册与右手）</text><text x="78" y="229" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#F0F4F0" font-weight="400">触发与回应：南门脚步 → 停笔抬眼 → 水位对白 → 拒绝 → 木匣落桌 → 顾取匣</text><text x="78" y="271" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#A6CFD5" font-weight="400">关键硬锁：唯一木匣右手持有；先松手，顾才可拿；东侧对话机位保留真实空间</text><rect x="55" y="350" width="1090" height="189" rx="14" fill="#20323B"/><text x="78" y="390" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#F2D4AA" font-weight="700">C-A  角色行动任务</text><text x="78" y="429" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">目标：使官员至少愿意检查汛情证据</text><text x="78" y="463" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">策略：先口头报水位，遭拒后用蜡封记录匣佐证</text><text x="78" y="498" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#BBD1DA" font-weight="400">眼线/回应：先看顾面孔，再看匣落点，最后看顾是否伸手</text><rect x="55" y="563" width="1090" height="189" rx="14" fill="#20323B"/><text x="78" y="603" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#F2D4AA" font-weight="700">C-B  角色行动任务</text><text x="78" y="642" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">目标：履行程序并避免误发令</text><text x="78" y="676" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0F4F0" font-weight="400">策略：先拒绝再亲自查看证据</text><text x="78" y="711" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#BBD1DA" font-weight="400">眼线/回应：账册→来访者→物证→来访者</text></svg>