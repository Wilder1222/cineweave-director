<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" data-artifact-id="CW-SF-A-G1-LIGHTING" data-provenance="design_vector_not_generated_media" role="img" aria-label="灯光卡  /  LIGHTING BIBLE"><rect x="0" y="0" width="1200" height="930" rx="0" fill="#101D27" stroke="none"/><rect x="40" y="28" width="5" height="64" rx="2" fill="#D7AB73" stroke="none"/><text x="64" y="69" fill="#FFFFFF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="33" font-weight="700">灯光卡  /  LIGHTING BIBLE</text><text x="64" y="101" fill="#9CB1BA" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="17" font-weight="400">《雨汛前夜》 · 主光、补光、阴影、强弱与拍摄职责</text><text x="58" y="899" fill="#96A8AB" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">CINEWEAVE  |  CW-SF-A-G1-LIGHTING  |  设计图板 · 非实拍/非生成结果</text><rect x="58" y="158" width="535" height="660" rx="17" fill="#20313B" stroke="none"/><text x="76" y="197" fill="#F7EBD8" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="700">A-LS1 · 北案桌对话空间</text><rect x="76" y="216" width="499" height="5" rx="2" fill="#C7A578" stroke="none"/><text x="76" y="270" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">光源绑定</text><text x="76" y="293" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">L-W / L-E</text><text x="76" y="327" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">主光</text><text x="76" y="350" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">西侧格窗宽而弱的漫射冷光为主要塑形依据</text><text x="76" y="384" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">辅光</text><text x="76" y="407" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">环境反射与木地面微弱反光作补光，灯具只作为不可见模拟手段，不新增画面内光源</text><text x="76" y="441" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">轮廓</text><text x="76" y="464" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">东侧油灯对近墙位置产生小面积暖色边缘光，不给所有角色强烈金色轮廓</text><text x="76" y="498" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">阴影</text><text x="76" y="521" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">冷灰软阴影，接触区域清楚但不把黑位压死</text><text x="76" y="555" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">衰减</text><text x="76" y="578" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">角色远离油灯则暖色明显减弱，西窗冷光相对增加</text><text x="76" y="612" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">色温意向</text><text x="76" y="635" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">创意监看参考约 4500 K，用于保留窗冷灯暖的相对关系；不是生成模型的真实物理相机参数</text><text x="76" y="669" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">光比意向</text><text x="76" y="692" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">西窗冷光主导，油灯暖光只点缀；仅为相对强弱，不声称现场测得光比</text><text x="76" y="726" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">对应镜头</text><text x="76" y="749" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">A-S01, A-S02, A-S03</text><rect x="607" y="158" width="535" height="660" rx="17" fill="#20313B" stroke="none"/><text x="625" y="197" fill="#F7EBD8" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="700">A-LS2 · 蜡封证据与决定</text><rect x="625" y="216" width="499" height="5" rx="2" fill="#C7A578" stroke="none"/><text x="625" y="270" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">光源绑定</text><text x="625" y="293" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">L-W / L-E</text><text x="625" y="327" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">主光</text><text x="625" y="350" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">沿用西窗冷漫射主光，保证红蜡与取物手同时可读</text><text x="625" y="384" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">辅光</text><text x="625" y="407" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">允许少量窗反射的非独立补光，不把人物皮肤漂白</text><text x="625" y="441" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">轮廓</text><text x="625" y="464" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">东灯仅在蜡封和铜包角形成窄暖边缘反射，禁用发光特效</text><text x="625" y="498" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">阴影</text><text x="625" y="521" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">木匣落桌时有真实接触阴影，顾拿起后阴影消退</text><text x="625" y="555" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">衰减</text><text x="625" y="578" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">油灯的暖边响应只跟物件的位置和朝向变化，不能随机换边</text><text x="625" y="612" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">色温意向</text><text x="625" y="635" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">继承 A-LS1 的创意监看设置，未实际拍摄校准</text><text x="625" y="669" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">光比意向</text><text x="625" y="692" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">证据匣可读性略提高，但不是全景换光源</text><text x="625" y="726" fill="#D3AE7B" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="16" font-weight="650">对应镜头</text><text x="625" y="749" fill="#D4DFDF" font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="400">A-S04, A-S05, A-S06</text></svg>